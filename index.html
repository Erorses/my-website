<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>It's You 💕</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #050508;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}

#message {
    position: fixed;
    bottom: 14%;
    width: 100%;
    text-align: center;
    color: #ff9acb;
    font-size: 36px;
    font-weight: bold;
    text-shadow: 0 0 12px #ff4fa3, 0 0 25px #ff168a;
    opacity: 0;
    transition: opacity 1.5s;
}

#hint {
    position: fixed;
    bottom: 7%;
    width: 100%;
    text-align: center;
    color: #aaa;
    font-size: 14px;
}

#again {
    position: fixed;
    bottom: 2%;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 22px;
    border: 1px solid #ff5da8;
    border-radius: 20px;
    background: #160b16;
    color: #ff9acb;
    opacity: 0;
}

</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div id="message">It's You 💕</div>
<div id="hint">Натисни на подарунок</div>
<button id="again" onclick="resetScene()">Повторити</button>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const message = document.getElementById("message");
const hint = document.getElementById("hint");
const again = document.getElementById("again");

let W, H;
let particles = [];
let opened = false;
let animationStarted = false;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    if (!animationStarted) resetScene();
}

window.addEventListener("resize", resize);

function makeShape(type) {
    const temp = document.createElement("canvas");
    temp.width = W;
    temp.height = H;

    const c = temp.getContext("2d");
    const x = W / 2;
    const y = H / 2;

    if (type === "gift") {
        const w = Math.min(190, W * .48);
        const h = 125;

        c.fillStyle = "#ed003d";
        c.fillRect(x-w/2, y-h/2, w, h);

        c.fillStyle = "#ffdf00";
        c.fillRect(x-14, y-h/2, 28, h);

        c.fillStyle = "#f5144c";
        c.fillRect(x-w/2-10, y-h/2-25, w+20, 30);

        c.fillStyle = "#ffdf00";
        c.fillRect(x-14, y-h/2-25, 28, 30);

        c.strokeStyle = "#ffdf00";
        c.lineWidth = 10;

        c.beginPath();
        c.ellipse(x-20, y-h/2-43, 22, 13, -.5, 0, Math.PI*2);
        c.stroke();

        c.beginPath();
        c.ellipse(x+20, y-h/2-43, 22, 13, .5, 0, Math.PI*2);
        c.stroke();

        c.fillStyle = "#ffdf00";
        c.beginPath();
        c.arc(x, y-h/2-43, 9, 0, Math.PI*2);
        c.fill();
    }

    if (type === "flowers") {
        const positions = [
            {x:x-75, y:y-65, s:.9},
            {x:x, y:y-105, s:1.1},
            {x:x+75, y:y-55, s:.9}
        ];

        positions.forEach((f) => {
            const fx = f.x;
            const fy = f.y;
            const s = f.s;

            // Стебло
            c.strokeStyle = "#38c86a";
            c.lineWidth = 5;
            c.lineCap = "round";
            c.beginPath();
            c.moveTo(fx, fy+10);
            c.quadraticCurveTo(fx-10, fy+75, fx, y+115);
            c.stroke();

            // Листочки
            c.fillStyle = "#35b95e";
            c.beginPath();
            c.ellipse(fx-13, fy+65, 16, 7, -.5, 0, Math.PI*2);
            c.fill();

            c.beginPath();
            c.ellipse(fx+12, fy+88, 16, 7, .5, 0, Math.PI*2);
            c.fill();

            // Пелюстки
            for (let i=0; i<12; i++) {
                const a = i*Math.PI/6;
                c.save();
                c.translate(fx, fy);
                c.rotate(a);
                c.fillStyle = "#fff";
                c.beginPath();
                c.ellipse(0, -22*s, 8*s, 16*s, 0, 0, Math.PI*2);
                c.fill();
                c.restore();
            }

            // Серединка
            c.fillStyle = "#ffdf00";
            c.beginPath();
            c.arc(fx, fy, 10*s, 0, Math.PI*2);
            c.fill();
        });
    }

    const image = c.getImageData(0, 0, W, H);
    const data = image.data;
    const result = [];

    for (let py=0; py<H; py+=4) {
        for (let px=0; px<W; px+=4) {
            const i = (py*W+px)*4;
            if (data[i+3] > 100) {
                result.push({
                    x:px,
                    y:py,
                    color:`rgb(${data[i]},${data[i+1]},${data[i+2]})`
                });
            }
        }
    }

    return result;
}

function setShape(type, scatter=false) {
    const targets = makeShape(type);

    particles = targets.map(t => ({
        x: scatter ? Math.random()*W : W/2+(Math.random()-.5)*W,
        y: scatter ? Math.random()*H : H/2+(Math.random()-.5)*H,
        tx:t.x,
        ty:t.y,
        color:t.color,
        size:1.5+Math.random()*1.5
    }));
}

function draw() {
    ctx.clearRect(0, 0, W, H);

    particles.forEach(p => {
        p.x += (p.tx-p.x)*.075;
        p.y += (p.ty-p.y)*.075;

        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
    });

    ctx.shadowBlur = 0;
    requestAnimationFrame(draw);
}

function openGift() {
    if (opened) return;
    opened = true;

    hint.style.opacity = "0";

    // Спочатку розліт частинок
    particles.forEach(p => {
        p.tx = Math.random()*W;
        p.ty = Math.random()*H;
    });

    // Потім збираємо ромашки
    setTimeout(() => {
        setShape("flowers", true);
    }, 900);

    setTimeout(() => {
        message.style.opacity = "1";
        again.style.opacity = "1";
    }, 3500);
}

function resetScene() {
    opened = false;
    message.style.opacity = "0";
    again.style.opacity = "0";
    hint.style.opacity = "1";
    setShape("gift", false);
}

resize();
resetScene();
animationStarted = true;
draw();

canvas.addEventListener("click", openGift);
</script>

</body>
</html>
