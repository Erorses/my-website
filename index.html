<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Квітковий букет</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #030303;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 25px 10px;
}

h1 {
    font-size: 19px;
    font-weight: normal;
    color: #e7e7e7;
    letter-spacing: 2px;
    margin-bottom: 5px;
    animation: fadeIn 2s ease both;
}

svg {
    display: block;
    width: min(96vw, 480px);
    height: auto;
    overflow: visible;
}

.flower {
    opacity: 0;
    animation: flowerAppear 1.3s ease forwards;
}

.stem {
    fill: none;
    stroke: #65e83f;
    stroke-width: 5;
    stroke-linecap: round;
}

.leaf {
    fill: url(#green);
    stroke: #75f34a;
    stroke-width: 1.5;
}

.wrapper {
    fill: url(#wrapperPattern);
    stroke: #ff85c3;
    stroke-width: 3;
}

.ribbon {
    fill: none;
    stroke: #ff91c6;
    stroke-width: 5;
}

.caption {
    text-align: center;
    color: #ff8fc8;
    font-size: 25px;
    font-weight: bold;
    margin-top: 0;
    animation: fadeIn 2s ease 3s both;
}

.small-text {
    color: #d9c3d1;
    font-size: 12px;
    margin-top: 12px;
    letter-spacing: 2px;
    animation: fadeIn 2s ease 3.5s both;
}

@keyframes flowerAppear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@media (max-width: 400px) {
    h1 {
        font-size: 16px;
    }

    .caption {
        font-size: 22px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
    }

    .flower {
        opacity: 1;
    }
}
</style>
</head>
